<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E2830;
    --panel:#153843;
    --line:#245260;
    --text:#E9F4F2;
    --muted:#93B3B8;
    --ai:#63D2C6;
    --me:#F3B94D;
    --me-text:#2A1C00;
    --danger:#FF9C8A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;min-height:0}

  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .orb{
    width:28px;height:28px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#C9FFF8,var(--ai) 45%,#1E7F77 100%);
    box-shadow:0 0 0 0 rgba(99,210,198,.5);
  }
  .orb.thinking{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(99,210,198,.55);transform:scale(1)}
    70%{box-shadow:0 0 0 14px rgba(99,210,198,0);transform:scale(1.08)}
    100%{box-shadow:0 0 0 0 rgba(99,210,198,0);transform:scale(1)}
  }
  h1{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;margin:0}
  .spacer{flex:1}

  .chip-btn{
    display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;font:inherit;font-size:13px;cursor:pointer;
  }
  .chip-btn:hover{color:var(--text);border-color:var(--muted)}
  .chip-btn[aria-pressed="true"]{color:var(--ai);border-color:var(--ai)}
  button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--me);outline-offset:2px}
  svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  #msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;min-height:0}

  .welcome{margin:auto 0;padding:8px 0}
  .welcome h2{font-family:'Sora',sans-serif;font-weight:700;font-size:26px;line-height:1.25;margin:0 0 8px;max-width:18ch}
  .welcome p{color:var(--muted);margin:0 0 20px;max-width:46ch;line-height:1.5}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px}
  .suggestions button{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;text-align:left;
  }
  .suggestions button:hover{border-color:var(--ai)}

  .msg{line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.me{
    align-self:flex-end;max-width:85%;background:var(--me);color:var(--me-text);
    padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;font-weight:500;
  }
  .msg.ai{align-self:flex-start;max-width:94%;padding-left:14px;border-left:2px solid var(--ai)}
  .msg.ai p{margin:0 0 .7em}
  .msg.ai p:last-child{margin-bottom:0}
  .msg.ai ul,.msg.ai ol{margin:0 0 .7em;padding-left:1.3em}
  .msg.ai li{margin-bottom:.25em}
  .msg.ai a{color:var(--ai)}
  .msg.ai code{background:#0A1D23;padding:1px 6px;border-radius:5px;font-size:.9em}
  .msg.ai pre{background:#0A1D23;padding:12px;border-radius:10px;overflow-x:auto;margin:0 0 .7em}
  .msg.ai pre code{padding:0;background:none}
  .msg.error{border-left-color:var(--danger)}
  .msg.error .retry{margin-top:10px}
  .dots{display:inline-flex;gap:5px;padding:6px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--ai);opacity:.4;animation:blink 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .imgcard{
    margin:0;align-self:flex-start;width:min(420px,100%);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);
  }
  .stage img{display:block;width:100%;height:auto}
  .ph{
    aspect-ratio:1/1;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:14px;
    background:linear-gradient(110deg,var(--panel) 30%,#1C4A58 50%,var(--panel) 70%);
    background-size:200% 100%;animation:shimmer 1.6s linear infinite;
  }
  .ph.failed{animation:none;background:var(--panel);color:var(--danger)}
  @keyframes shimmer{to{background-position:-200% 0}}
  .imgbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
  .imgbar .cap{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{
    background:transparent;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;
  }
  .mini:hover:not(:disabled){border-color:var(--ai)}
  .mini:disabled{opacity:.4;cursor:default}

  .composer{display:flex;gap:8px;align-items:flex-end;padding:12px 20px 6px;border-top:1px solid var(--line)}
  textarea{
    flex:1;resize:none;max-height:140px;min-height:46px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:12px 14px;font:inherit;line-height:1.35;
  }
  textarea::placeholder{color:var(--muted)}
  .sq{
    width:46px;height:46px;flex:none;display:grid;place-items:center;cursor:pointer;
    border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  }
  .sq:hover{color:var(--text);border-color:var(--muted)}
  .sq[aria-pressed="true"]{color:var(--ai);border-color:var(--ai)}
  .sq.on{color:#06201D;background:var(--me);border-color:var(--me)}
  .sq.send{background:var(--ai);border-color:var(--ai);color:#06201D}
  .sq.send:disabled{opacity:.45;cursor:default}
  .note{padding:0 20px 12px;font-size:12px;color:var(--muted);line-height:1.4}

  @media (max-width:520px){
    .chip-btn span{display:none}
    .welcome h2{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>Assistente IA</h1>
    <div class="spacer"></div>
    <button class="chip-btn" id="voiceBtn" aria-pressed="false" title="Ler as respostas em voz alta">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span>Voz</span>
    </button>
    <button class="chip-btn" id="newBtn" title="Começar uma conversa nova">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nova conversa</span>
    </button>
  </header>

  <main id="msgs" aria-live="polite"></main>

  <form class="composer" id="form" autocomplete="off">
    <button type="button" class="sq" id="imgBtn" aria-pressed="false" title="Modo imagem: tudo que eu escrever vira uma imagem">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Pergunte qualquer coisa do dia a dia" aria-label="Sua mensagem"></textarea>
    <button type="button" class="sq" id="micBtn" title="Falar em vez de digitar">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="sq send" id="sendBtn" title="Enviar">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="note">Sem chave de API: usa o serviço gratuito Pollinations. As imagens saem uma a cada ~15 segundos. Para pedir uma imagem, escreva "gere uma imagem de…" ou ligue o botão de imagem.</p>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const msgsEl = $('#msgs'), form = $('#form'), input = $('#input');
  const sendBtn = $('#sendBtn'), micBtn = $('#micBtn'), imgBtn = $('#imgBtn');
  const voiceBtn = $('#voiceBtn'), newBtn = $('#newBtn'), orb = $('#orb');

  const SYSTEM =
    'Você é um assistente prestativo que responde dúvidas do dia a dia em português do Brasil. ' +
    'Seja claro, direto e simpático. Por padrão responda em poucas frases; use passo a passo só quando ajudar. ' +
    'Se não souber algo, diga que não sabe em vez de inventar. ' +
    'Em saúde, leis e dinheiro, dê informação geral e sugira procurar um profissional quando fizer sentido. ' +
    'O aplicativo gera imagens quando a pessoa pede, então nunca diga que não consegue criar imagens.';

  const SUGGESTIONS = [
    'Como tirar mancha de café da roupa?',
    'Quanto tempo cozinhar um ovo mole?',
    'Me explique juros compostos de um jeito simples',
    'Gere uma imagem de um gato astronauta na lua'
  ];

  let history = [];       // {role, content} ou {type:'image', ...}
  let busy = false;
  let imageMode = false;
  let voiceOn = false;
  let lastImg = 0;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* ---------- armazenamento (opcional, falha em silêncio) ---------- */
  function save(){
    try{ localStorage.setItem('ia_hist', JSON.stringify(history.filter(m => !m.type).slice(-40))); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem('ia_hist');
      if(raw) history = JSON.parse(raw).filter(m => m && m.role && m.content);
      voiceOn = localStorage.getItem('ia_voz') === '1';
    }catch(e){}
  }

  /* ---------- markdown simples e seguro ---------- */
  function inline(s){
    return s
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function md(src){
    const blocks = [];
    src = src.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c.replace(/\n$/,'')); return '\u0000' + (blocks.length-1) + '\u0000'; });
    const lines = esc(src).split('\n');
    let html = '', list = null, para = [];
    const flushP = () => { if(para.length){ html += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; } };
    const flushL = () => { if(list){ html += '</' + list + '>'; list = null; } };
    for(const ln of lines){
      let m;
      if((m = ln.match(/^\u0000(\d+)\u0000$/))){ flushP(); flushL(); html += '<pre><code>' + esc(blocks[+m[1]]) + '</code></pre>'; }
      else if((m = ln.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if(list !== 'ul'){ flushL(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if((m = ln.match(/^\s*(\d+)[.)]\s+(.*)/))){ flushP(); if(list !== 'ol'){ flushL(); html += '<ol start="' + m[1] + '">'; list = 'ol'; } html += '<li>' + inline(m[2]) + '</li>'; }
      else if((m = ln.match(/^#{1,4}\s+(.*)/))){ flushP(); flushL(); html += '<p><strong>' + inline(m[1]) + '</strong></p>'; }
      else if(!ln.trim()){ flushP(); }
      else { flushL(); para.push(ln); }
    }
    flushP(); flushL();
    return html;
  }

  /* ---------- interface ---------- */
  function scrollDown(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
  function setThinking(on){ orb.classList.toggle('thinking', on); sendBtn.disabled = on; }

  function showWelcome(){
    msgsEl.innerHTML = '';
    const w = document.createElement('section');
    w.className = 'welcome';
    w.innerHTML = '<h2>Pergunte qualquer coisa do dia a dia.</h2>' +
      '<p>Dúvidas de casa, cozinha, dinheiro, estudos… e também crio imagens a partir do que você descrever.</p>';
    const box = document.createElement('div');
    box.className = 'suggestions';
    SUGGESTIONS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.onclick = () => send(t);
      box.appendChild(b);
    });
    w.appendChild(box);
    msgsEl.appendChild(w);
  }
  function clearWelcome(){ const w = msgsEl.querySelector('.welcome'); if(w) w.remove(); }

  function addMsg(role, text, typing){
    clearWelcome();
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    if(typing) el.innerHTML = '<span class="dots" aria-label="Pensando"><i></i><i></i><i></i></span>';
    else if(role === 'ai') el.innerHTML = md(text);
    else el.textContent = text;
    msgsEl.appendChild(el);
    scrollDown();
    return el;
  }
  function addError(el, text, retryFn){
    el.className = 'msg ai error';
    el.innerHTML = '<p>' + esc(text) + '</p>';
    if(retryFn){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mini retry'; b.textContent = 'Tentar de novo';
      b.onclick = () => { el.remove(); run(retryFn); };
      el.appendChild(b);
    }
    scrollDown();
  }

  /* ---------- texto (Pollinations, sem chave) ---------- */
  async function askText(messages, withFallback = true){
    let lastErr;
    for(let i = 0; i < 2; i++){
      try{
        const r = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ model: 'openai', messages, private: true })
        });
        if(r.status === 429 && i === 0){ await sleep(7000); continue; }
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if(t && t.trim()) return t.trim();
        throw new Error('resposta vazia');
      }catch(e){ lastErr = e; }
    }
    if(!withFallback) throw lastErr;
    // plano B: endpoint simples por GET
    const convo = messages.filter(m => m.role !== 'system')
      .map(m => (m.role === 'user' ? 'Pessoa: ' : 'Assistente: ') + m.content).join('\n');
    const url = 'https://text.pollinations.ai/' + encodeURIComponent(convo.slice(-1500)) +
      '?model=openai&system=' + encodeURIComponent(SYSTEM);
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const t = (await r.text()).trim();
    if(!t) throw new Error('resposta vazia');
    return t;
  }

  async function doChat(){
    const ctx = history.filter(m => !m.type).slice(-12).map(m => ({role: m.role, content: m.content}));
    const el = addMsg('ai', '', true);
    try{
      const answer = await askText([{role: 'system', content: SYSTEM}, ...ctx]);
      el.className = 'msg ai';
      el.innerHTML = md(answer);
      history.push({role: 'assistant', content: answer});
      save();
      if(voiceOn) speak(answer);
      scrollDown();
    }catch(e){
      addError(el, 'Não consegui falar com o serviço gratuito agora. Confira sua internet e tente de novo em alguns segundos.', doChat);
    }
  }

  /* ---------- imagens (Pollinations, sem chave) ---------- */
  const IMG_WORDS = 'imagem|imagens|foto|fotos|fotografia|desenho|ilustra[cç][aã]o|logo|logotipo|wallpaper|figura|pintura|arte';
  const IMG_RE = new RegExp('\\b(gere|gera|gerar|crie|cria|criar|desenhe|desenha|desenhar|fa[cç]a|faz|fazer|mostre|mostra|monte|produza)\\b[^.?!\\n]{0,40}\\b(' + IMG_WORDS + ')\\b', 'i');
  function isImageRequest(t){
    const s = t.trim();
    if(/^\/(img|imagem)\b/i.test(s)) return true;
    if(/^(como|qual|quais|o que|por que|porque|quando|onde)\b/i.test(s)) return false;
    return IMG_RE.test(s);
  }
  const imageUrl = (prompt, seed) =>
    'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) +
    '?width=1024&height=1024&nologo=true&seed=' + seed;

  function makePh(text, failed){
    const d = document.createElement('div');
    d.className = 'ph' + (failed ? ' failed' : '');
    const s = document.createElement('span');
    s.className = 'st'; s.textContent = text;
    d.appendChild(s);
    return d;
  }
  function setStatus(card, text){
    const st = card.querySelector('.st');
    if(st) st.textContent = text;
  }
  async function waitSlot(card){
    const wait = lastImg + 15500 - Date.now();
    if(wait > 0){
      for(let s = Math.ceil(wait / 1000); s > 0; s--){
        setStatus(card, 'Na fila: ' + s + ' s (limite do serviço gratuito)');
        await sleep(1000);
      }
    }
    lastImg = Date.now();
  }
  function setBar(card, enabled){
    card.querySelectorAll('.mini').forEach(b => b.disabled = !enabled);
  }

  function loadImage(card, url, attempt){
    return new Promise(resolve => {
      const img = new Image();
      img.alt = card.dataset.cap || 'Imagem gerada';
      img.onload = () => {
        card.querySelector('.stage').replaceChildren(img);
        setBar(card, true);
        scrollDown();
        resolve();
      };
      img.onerror = async () => {
        if(attempt < 2){
          setStatus(card, 'O serviço está ocupado. Tentando de novo…');
          await sleep(16000);
          lastImg = Date.now();
          loadImage(card, url, attempt + 1).then(resolve);
        }else{
          const stage = card.querySelector('.stage');
          stage.replaceChildren(makePh('Não consegui criar a imagem. O serviço gratuito aceita 1 pedido a cada ~15 s. Toque em "Outra versão" para tentar de novo.', true));
          card.querySelector('.again').disabled = false;
          resolve();
        }
      };
      img.src = url + (attempt ? '&r=' + attempt : '');
    });
  }

  async function genImage(card, seed){
    card.querySelector('.stage').replaceChildren(makePh('Preparando…'));
    setBar(card, false);
    await waitSlot(card);
    setStatus(card, 'Criando a imagem…');
    const url = imageUrl(card.dataset.en, seed);
    card.dataset.url = url;
    await loadImage(card, url, 0);
  }

  async function download(card){
    const url = card.dataset.url;
    try{
      const r = await fetch(url);
      if(!r.ok) throw new Error();
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'imagem.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }catch(e){
      window.open(url, '_blank', 'noopener');
    }
  }

  function buildCard(caption, en){
    clearWelcome();
    const card = document.createElement('figure');
    card.className = 'imgcard';
    card.dataset.cap = caption;
    card.dataset.en = en;
    card.innerHTML = '<div class="stage"></div>' +
      '<figcaption class="imgbar"><span class="cap"></span>' +
      '<button type="button" class="mini dl" disabled>Baixar</button>' +
      '<button type="button" class="mini again" disabled>Outra versão</button></figcaption>';
    card.querySelector('.cap').textContent = caption;
    card.querySelector('.dl').onclick = () => download(card);
    card.querySelector('.again').onclick = () => genImage(card, Math.floor(Math.random() * 1e6));
    msgsEl.appendChild(card);
    scrollDown();
    return card;
  }

  async function doImage(text){
    const clean = text.replace(/^\/(img|imagem)\s*/i, '').trim() || text;
    const card = buildCard(clean, clean);
    card.querySelector('.stage').replaceChildren(makePh('Entendendo o pedido…'));
    let en = clean;
    try{
      const t = await askText([
        {role: 'system', content: 'Convert the user request into one detailed English prompt for an image generator (subject, style, lighting, composition). Reply with the prompt only, no quotes, no extra text.'},
        {role: 'user', content: clean}
      ], false);
      en = t.replace(/^["'\s]+|["'\s]+$/g, '').slice(0, 600) || clean;
    }catch(e){ /* usa o texto original */ }
    card.dataset.en = en;
    history.push({type: 'image', caption: clean});
    await genImage(card, Math.floor(Math.random() * 1e6));
  }

  /* ---------- fluxo principal ---------- */
  async function run(fn){
    if(busy) return;
    busy = true; setThinking(true);
    try{ await fn(); } finally { busy = false; setThinking(false); }
  }

  function send(text){
    text = (text || '').trim();
    if(!text || busy) return;
    clearWelcome();
    addMsg('me', text);
    input.value = ''; autosize();
    if(window.speechSynthesis) speechSynthesis.cancel();
    if(imageMode || isImageRequest(text)){
      history.push({role: 'user', content: text});
      save();
      run(() => doImage(text));
    }else{
      history.push({role: 'user', content: text});
      save();
      run(doChat);
    }
  }

  /* ---------- voz ---------- */
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_`#>]/g, '').replace(/https?:\/\/\S+/g, 'link'));
    u.lang = 'pt-BR';
    speechSynthesis.speak(u);
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    micBtn.hidden = true;
  }else{
    const rec = new SR();
    rec.lang = 'pt-BR';
    rec.interimResults = false;
    rec.onresult = e => { send(e.results[0][0].transcript); };
    rec.onend = () => micBtn.classList.remove('on');
    rec.onerror = () => micBtn.classList.remove('on');
    micBtn.onclick = () => {
      if(micBtn.classList.contains('on')){ rec.stop(); return; }
      if(window.speechSynthesis) speechSynthesis.cancel();
      try{ rec.start(); micBtn.classList.add('on'); }catch(e){}
    };
  }

  /* ---------- eventos ---------- */
  function autosize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(input.value); }
  });
  form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });

  imgBtn.onclick = () => {
    imageMode = !imageMode;
    imgBtn.setAttribute('aria-pressed', imageMode);
    input.placeholder = imageMode ? 'Descreva a imagem que você quer criar' : 'Pergunte qualquer coisa do dia a dia';
    input.focus();
  };
  voiceBtn.onclick = () => {
    voiceOn = !voiceOn;
    voiceBtn.setAttribute('aria-pressed', voiceOn);
    try{ localStorage.setItem('ia_voz', voiceOn ? '1' : '0'); }catch(e){}
    if(!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  };
  newBtn.onclick = () => {
    if(busy) return;
    history = []; save();
    if(window.speechSynthesis) speechSynthesis.cancel();
    showWelcome();
  };

  /* ---------- início ---------- */
  load();
  voiceBtn.setAttribute('aria-pressed', voiceOn);
  if(history.length){
    clearWelcome();
    history.forEach(m => addMsg(m.role === 'user' ? 'me' : 'ai', m.content));
  }else{
    showWelcome();
  }
  input.focus();
})();
</script>
</body>
</html>
